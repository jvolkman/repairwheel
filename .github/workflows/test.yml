name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Smoke tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ensure latest pip
        run: python -m pip install --break-system-packages --upgrade pip

      - name: Install Hatch
        run: python -m pip install --break-system-packages hatch

      - name: Run smoke tests
        run: hatch env run -e test.py${{ matrix.python-version }} smoke

  matrix-test:
    name: Unit tests - Python ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'alpine' && 'ubuntu-latest' || format('{0}-latest', matrix.platform) }}
    container: ${{ matrix.platform == 'alpine' && 'alpine:latest' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows, macos, alpine]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.platform != 'alpine'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Alpine)
        if: matrix.platform == 'alpine'
        run: apk add --no-cache python3 python3-dev py3-pip gcc musl-dev bzip2-dev gcompat llvm

      - name: Ensure latest pip
        run: python -m pip install --break-system-packages --upgrade pip

      - name: Install Hatch
        run: python -m pip install --break-system-packages hatch

      - name: Install system test dependencies (Linux Glibc)
        if: matrix.platform == 'ubuntu'
        run: |
          sudo apt-get update && sudo apt-get install -y libbz2-dev llvm-20
          echo "REPAIRWHEEL_TEST_LLVM_STRIP=/usr/bin/llvm-strip-20" >> "$GITHUB_ENV"
          # Ubuntu 24.04's GNU strip (binutils 2.42) corrupts ELF files whose PHDR table
          # isn't at the start of the file (https://sourceware.org/bugzilla/show_bug.cgi?id=32946).
          # binutils >= 2.44 handles the patcher's layout, so test against Homebrew's binutils.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 /home/linuxbrew/.linuxbrew/bin/brew install binutils
          echo "REPAIRWHEEL_TEST_GNU_STRIP=$(/home/linuxbrew/.linuxbrew/bin/brew --prefix binutils)/bin/strip" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          # Fail (rather than skip) the strip compatibility tests if a strip tool is missing.
          REPAIRWHEEL_TEST_REQUIRE_STRIP: ${{ (matrix.platform == 'ubuntu' || matrix.platform == 'alpine') && '1' || '' }}
        run: hatch env run -e test.py${{ matrix.python-version }} test

  generate:
    name: Gen - Python ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'alpine' && 'ubuntu-latest' || format('{0}-latest', matrix.platform) }}
    container: ${{ matrix.platform == 'alpine' && 'alpine:latest' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows, macos, alpine]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.platform != 'alpine'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Alpine)
        if: matrix.platform == 'alpine'
        run: apk add --no-cache python3 python3-dev py3-pip gcc musl-dev bzip2-dev gcompat

      - name: Ensure latest pip
        run: python -m pip install --break-system-packages --upgrade pip

      - name: Install Hatch
        run: python -m pip install --break-system-packages hatch

      - name: Generate patched wheels
        env:
          TESTWHEEL_GENERATE_PATH: ${{ runner.temp }}/testwheel-out/${{ matrix.python-version }}/${{ matrix.platform }}${{ matrix.platform == 'alpine' && '-musl' || '' }}
        run: hatch env run -e test.py${{ matrix.python-version }} generate

      - uses: actions/upload-artifact@v7
        with:
          name: patched-testwheel-${{ matrix.platform }}-${{ matrix.python-version }}${{ matrix.platform == 'alpine' && '-musl' || '' }}
          path: ${{ runner.temp }}/testwheel-out

  check:
    name: Check - Python ${{ matrix.python-version }} on ${{ matrix.platform }}
    needs: generate
    runs-on: ${{ matrix.platform == 'alpine' && 'ubuntu-latest' || format('{0}-latest', matrix.platform) }}
    container: ${{ matrix.platform == 'alpine' && 'alpine:latest' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows, macos, alpine]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.platform != 'alpine'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Alpine)
        if: matrix.platform == 'alpine'
        run: apk add --no-cache python3 python3-dev py3-pip gcc musl-dev bzip2-dev gcompat

      - name: Ensure latest pip
        run: python -m pip install --break-system-packages --upgrade pip

      - name: Install Hatch
        run: python -m pip install --break-system-packages hatch

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/testwheel-out

      - name: Check wheels
        env:
          TESTWHEEL_GENERATE_PATH: ${{ runner.temp }}/testwheel-out/
        run: hatch env run -e test.py${{ matrix.python-version }} check
